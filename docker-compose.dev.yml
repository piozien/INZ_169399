version: '3.8'

services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: su-mailhog-dev
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    environment:
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/maildir
    volumes:
      - mailhog_data:/maildir
    networks:
      - su-dev-network

  postgres-dev:
    image: postgres:15-alpine
    container_name: su-postgres-dev
    environment:
      POSTGRES_DB: su_dev
      POSTGRES_USER: su_user
      POSTGRES_PASSWORD: su_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - su-dev-network
    profiles:
      - postgres

volumes:
  mailhog_data:
  postgres_dev_data:

networks:
  su-dev-network:
    driver: bridge