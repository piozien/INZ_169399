services:

  database:
    image: postgres:17.5-alpine
    container_name: su_database_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samorzad}
      POSTGRES_USER: ${POSTGRES_USER:-samorzad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samorzad123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - su_network_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samorzad} -d ${POSTGRES_DB:-samorzad}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./su_backend
      dockerfile: Dockerfile.dev
    container_name: su_backend_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-samorzad}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-samorzad}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-samorzad123}
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      database:
        condition: service_healthy
    networks:
      - su_network_dev
    volumes:
      - ./su_backend:/app
      - /root/.m2:/root/.m2

  frontend:
    build:
      context: ./su_frontend
      dockerfile: Dockerfile.dev
    container_name: su_frontend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
      NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID}
    depends_on:
      - backend
    networks:
      - su_network_dev
    volumes:
      - ./su_frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  su_network_dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
