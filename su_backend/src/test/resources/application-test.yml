spring:
  application:
    name: su-backend-test

  datasource:
    url: jdbc:postgresql://localhost:5433/su_test_db
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

ACS_CONNECTION_STRING: "endpoint=https://fake.azure.com/;accesskey=fake"
ACS_SENDER_ADDRESS: "no-reply@test.su.edu"