services:

  # PostgreSQL Database
  database:
    image: postgres:17.5-alpine
    container_name: su_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - su_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./su_backend
      dockerfile: Dockerfile
    container_name: su_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      
      # Password Reset Configuration
      PASSWORD_RESET_EXPIRATION_HOURS: ${PASSWORD_RESET_EXPIRATION_HOURS}
      FRONTEND_URL: ${FRONTEND_URL}
      
      # Scheduling Configuration
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED}
      
      # Microsoft Graph / Outlook Calendar
      MS_GRAPH_BASE_URL: ${MS_GRAPH_BASE_URL}
      MS_CALENDAR_ENABLED: ${MS_CALENDAR_ENABLED}
      MS_CALENDAR_USE_SHARED_OWNER: ${MS_CALENDAR_USE_SHARED_OWNER}
      MS_CALENDAR_OWNER_USER_ID: ${MS_CALENDAR_OWNER_USER_ID}
      MS_CALENDAR_EVENTS_PATH_ME: ${MS_CALENDAR_EVENTS_PATH_ME}
      MS_CALENDAR_EVENTS_PATH_USER: ${MS_CALENDAR_EVENTS_PATH_USER}
      
      # Email Configuration
      ACS_CONNECTION_STRING: ${ACS_CONNECTION_STRING}
      ACS_SENDER_ADDRESS: ${ACS_SENDER_ADDRESS}
      
      # OAuth2 Microsoft Configuration
      OAUTH2_MICROSOFT_CLIENT_ID: ${OAUTH2_MICROSOFT_CLIENT_ID}
      OAUTH2_MICROSOFT_CLIENT_SECRET: ${OAUTH2_MICROSOFT_CLIENT_SECRET}
      OAUTH2_MICROSOFT_SCOPE: ${OAUTH2_MICROSOFT_SCOPE}
      OAUTH2_MICROSOFT_GRANT_TYPE: ${OAUTH2_MICROSOFT_GRANT_TYPE}
      OAUTH2_MICROSOFT_REDIRECT_URI: ${OAUTH2_MICROSOFT_REDIRECT_URI}
      OAUTH2_MICROSOFT_AUTHORIZATION_URI: ${OAUTH2_MICROSOFT_AUTHORIZATION_URI}
      OAUTH2_MICROSOFT_TOKEN_URI: ${OAUTH2_MICROSOFT_TOKEN_URI}
      OAUTH2_MICROSOFT_USER_INFO_URI: ${OAUTH2_MICROSOFT_USER_INFO_URI}
      OAUTH2_MICROSOFT_USER_NAME_ATTRIBUTE: ${OAUTH2_MICROSOFT_USER_NAME_ATTRIBUTE}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - su_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./su_frontend
      dockerfile: Dockerfile
    container_name: su_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - su_network

networks:
  su_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

